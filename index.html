<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Эл суши - Премиум Суши Бар</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            red: '#FF2E55', darkred: '#D91B40',
                            gold: '#FFB800', bg: '#0F1015',
                            card: '#181A22', border: '#2A2D3A'
                        }
                    },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; }
        html { overflow-x: hidden; }
        body { background-color:#0F1015; color:#E2E8F0; font-family:'Plus Jakarta Sans',sans-serif; overflow-x:hidden; max-width:100vw; }
        ::-webkit-scrollbar { width:8px; }
        ::-webkit-scrollbar-track { background:#0F1015; }
        ::-webkit-scrollbar-thumb { background:#2A2D3A; border-radius:4px; }
        ::-webkit-scrollbar-thumb:hover { background:#FF2E55; }
        .glass-header { background:rgba(15,16,21,0.85); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); }
        .glow-red { box-shadow:0 0 25px rgba(255,46,85,0.35); }
        .product-card { transition:all 0.3s cubic-bezier(0.4,0,0.2,1); }
        /* Мобилде hover жок — телефондо тийишинен */
        @media (hover: hover) {
            .product-card:hover { transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,0.5),0 0 15px rgba(255,46,85,0.2); }
        }
        .no-scrollbar::-webkit-scrollbar { display:none; }
        .no-scrollbar { -ms-overflow-style:none; scrollbar-width:none; }
        .logo-fallback { display:flex; align-items:center; gap:10px; }
        .logo-fallback .logo-icon { width:44px; height:44px; background:linear-gradient(135deg,#FF2E55,#D91B40); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; color:white; font-weight:900; flex-shrink:0; box-shadow:0 0 20px rgba(255,46,85,0.4); }
        .logo-fallback .logo-text-main { font-size:22px; font-weight:900; color:white; line-height:1; letter-spacing:2px; }
        .logo-fallback .logo-text-sub { font-size:9px; color:#FF2E55; font-weight:700; letter-spacing:4px; text-transform:uppercase; }
        /* Тил баскычы */
        .lang-btn { transition:all 0.2s; }
        .lang-btn.active { background:#FF2E55; color:white; border-color:#FF2E55; }
        .lang-btn:not(.active) { background:transparent; color:#9CA3AF; border-color:#2A2D3A; }
        .lang-btn:not(.active):hover { color:white; border-color:#9CA3AF; }
        /* Hero blur overflow fix */
        .hero-glow { position:absolute; inset:0; background:linear-gradient(to right,#FF2E55,#f97316); border-radius:1.5rem; filter:blur(32px); opacity:0.18; animation:heroP 2s infinite; pointer-events:none; }
        @keyframes heroP { 0%,100%{opacity:.18} 50%{opacity:.28} }
        /* Мобилде карточка сүрөтүнүн бийиктиги авто */
        @media (max-width: 639px) {
            .product-card { min-height: 110px; }
            .product-card img { height: 110px !important; width: 120px !important; border-radius: 0.75rem 0 0 0.75rem; }
            .header-logo img { height: 38px !important; }
            .logo-fallback .logo-icon { width:34px; height:34px; font-size:17px; }
            .logo-fallback .logo-text-main { font-size:17px; }
        }
    </style>
</head>
<body class="bg-brand-bg min-h-screen flex flex-col justify-between">

    <!-- ANNOUNCEMENT BAR -->
    <div class="bg-gradient-to-r from-brand-red via-purple-600 to-brand-red text-white text-xs py-2 px-4 text-center font-medium tracking-wide">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
            <div class="hidden lg:flex items-center gap-2 shrink-0">
                <i class="fa-solid fa-clock"></i>
                <span id="headerWorkHours"></span>
            </div>
            <div class="flex-1 text-center text-xs sm:text-sm">
                🔥 <b data-i18n="promo_label"></b> <span data-i18n="promo_text"></span>
            </div>
            <div id="topBranchInfo" class="hidden lg:flex items-center gap-2 font-semibold text-brand-gold shrink-0">
                <i class="fa-solid fa-store"></i> <span id="activeBranchCount"></span>
            </div>
        </div>
    </div>

    <!-- HEADER -->
    <header class="sticky top-0 z-40 glass-header border-b border-brand-border/60">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 sm:h-20 gap-2">

                <!-- Logo -->
                <a href="index.html" class="flex items-center shrink-0 header-logo">
                    <img id="headerLogo" src="logo.png" alt="Эл Суши Лого"
                         class="h-10 sm:h-14 w-auto object-contain"
                         onerror="this.style.display='none'; document.getElementById('headerLogoFallback').style.display='flex';">
                    <div id="headerLogoFallback" class="logo-fallback" style="display:none;">
                        <div class="logo-icon">🍣</div>
                        <div>
                            <div class="logo-text-main">ЭЛ СУШИ</div>
                            <div class="logo-text-sub">SUSHI BAR</div>
                        </div>
                    </div>
                </a>

                <!-- Search (desktop) -->
                <div class="hidden md:flex items-center flex-1 max-w-sm lg:max-w-md mx-4 lg:mx-8 relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-gray-400"></i>
                    <input type="text" id="searchInput" oninput="handleSearch()"
                        data-i18n-placeholder="search_placeholder"
                        class="w-full bg-brand-card border border-brand-border rounded-full py-2.5 pl-11 pr-4 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-red transition">
                </div>

                <!-- Actions -->
                <div class="flex items-center gap-2 sm:gap-3 shrink-0">
                    <!-- Nav links — планшет жана чоңурак -->
                    <a href="#menu"     data-i18n="nav_menu"     class="hidden lg:inline-block text-gray-300 hover:text-white font-medium text-sm transition"></a>
                    <a href="#branches" data-i18n="nav_branches" class="hidden lg:inline-block text-gray-300 hover:text-white font-medium text-sm transition"></a>

                    <!-- Тил которуу -->
                    <div class="flex items-center gap-0.5 border border-brand-border rounded-full px-1 py-1">
                        <button onclick="setLang('ru')" id="langBtn-ru" class="lang-btn text-[11px] font-bold px-2 py-1 rounded-full border">RU</button>
                        <button onclick="setLang('ky')" id="langBtn-ky" class="lang-btn text-[11px] font-bold px-2 py-1 rounded-full border">КГ</button>
                    </div>

                    <!-- Себет -->
                    <button onclick="toggleCart()" class="relative bg-brand-red hover:bg-brand-darkred text-white px-3 sm:px-5 py-2 sm:py-2.5 rounded-full font-semibold flex items-center gap-2 transition-all duration-200 glow-red">
                        <i class="fa-solid fa-basket-shopping text-base"></i>
                        <span data-i18n="cart_btn" class="hidden sm:inline text-sm"></span>
                        <span id="cartBadge" class="bg-white text-brand-red text-xs font-black rounded-full px-1.5 py-0.5 min-w-[18px] text-center leading-none">0</span>
                    </button>
                </div>
            </div>

            <!-- Mobile Search -->
            <div class="pb-3 md:hidden">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="mobileSearchInput" oninput="handleSearch()"
                        data-i18n-placeholder="search_placeholder_short"
                        class="w-full bg-brand-card border border-brand-border rounded-full py-2.5 pl-11 pr-4 text-sm text-white placeholder-gray-400 focus:outline-none focus:border-brand-red">
                </div>
            </div>
        </div>
    </header>

    <!-- HERO BANNER -->
    <section class="relative py-10 md:py-20 overflow-hidden">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
            <div class="grid md:grid-cols-2 gap-8 md:gap-12 items-center">
                <div class="space-y-5 sm:space-y-6 text-center md:text-left">
                    <div class="inline-flex items-center gap-2 bg-brand-red/10 border border-brand-red/30 px-3 sm:px-4 py-1.5 rounded-full text-brand-red text-xs sm:text-sm font-semibold max-w-full">
                        <span data-i18n="hero_badge" class="leading-snug"></span>
                    </div>
                    <h1 class="text-3xl sm:text-4xl md:text-5xl lg:text-6xl font-extrabold text-white leading-tight">
                        <span data-i18n="hero_title_1"></span>
                        <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-red to-orange-400" data-i18n="hero_title_2"></span>
                        <span data-i18n="hero_title_3"></span>
                    </h1>
                    <p data-i18n="hero_desc" class="text-gray-400 text-sm sm:text-base lg:text-lg max-w-xl mx-auto md:mx-0"></p>
                    <div class="flex flex-col xs:flex-row sm:flex-row gap-3 sm:gap-4 justify-center md:justify-start">
                        <a href="#menu" data-i18n="hero_btn_menu" class="bg-brand-red hover:bg-brand-darkred text-white font-bold px-6 sm:px-8 py-3 sm:py-4 rounded-xl text-center transition glow-red text-sm sm:text-base"></a>
                        <a href="#branches" class="bg-brand-card hover:bg-brand-border text-white border border-brand-border font-bold px-6 sm:px-8 py-3 sm:py-4 rounded-xl text-center transition flex items-center justify-center gap-2 text-sm sm:text-base">
                            <i class="fa-solid fa-location-dot text-brand-red"></i>
                            <span data-i18n="hero_btn_branches"></span>
                        </a>
                    </div>
                </div>
                <div class="relative overflow-hidden rounded-3xl">
                    <div class="hero-glow"></div>
                    <img src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=1000&q=80"
                        alt="Суши Сет"
                        class="relative rounded-3xl object-cover w-full h-[260px] sm:h-[380px] md:h-[420px] shadow-2xl border border-brand-border">
                </div>
            </div>
        </div>
    </section>

    <!-- MENU SECTION -->
    <section id="menu" class="py-10 sm:py-12 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 sm:mb-8">
            <div>
                <h2 data-i18n="menu_title" class="text-2xl sm:text-3xl font-extrabold text-white"></h2>
                <p data-i18n="menu_subtitle" class="text-gray-400 text-sm mt-1"></p>
            </div>
            <div class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar w-full sm:w-auto" id="categoryContainer"></div>
        </div>
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-5"></div>
    </section>

    <!-- BRANCHES DISPLAY -->
    <section id="branches" class="py-12 sm:py-16 bg-brand-card/30 border-t border-brand-border/40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="text-center max-w-2xl mx-auto mb-8 sm:mb-12">
                <h2 data-i18n="branches_title" class="text-2xl sm:text-3xl font-extrabold text-white"></h2>
                <p data-i18n="branches_subtitle" class="text-gray-400 text-sm mt-2"></p>
            </div>
            <div id="branchesDisplayGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="bg-brand-card border-t border-brand-border/80 text-gray-400 mt-auto pt-10 sm:pt-12 pb-8">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 sm:gap-8 pb-8 sm:pb-10 border-b border-brand-border/60">

                <!-- Col 1 -->
                <div class="col-span-2 lg:col-span-1 space-y-4">
                    <div class="flex items-center">
                        <img id="footerLogo" src="logo.png" alt="Эл Суши" class="h-10 w-auto object-contain"
                             onerror="this.style.display='none'; document.getElementById('footerLogoFallback').style.display='flex';">
                        <div id="footerLogoFallback" class="logo-fallback" style="display:none;">
                            <div class="logo-icon" style="width:32px;height:32px;font-size:16px;">🍣</div>
                            <div>
                                <div class="logo-text-main" style="font-size:17px;">ЭЛ СУШИ</div>
                                <div class="logo-text-sub" style="font-size:8px;">SUSHI BAR</div>
                            </div>
                        </div>
                    </div>
                    <p data-i18n="footer_about" class="text-xs leading-relaxed text-gray-400"></p>
                    <div class="flex items-center gap-3 pt-2" id="footerSocialLinks"></div>
                </div>

                <!-- Col 2 -->
                <div class="space-y-3">
                    <h4 data-i18n="footer_nav_title" class="text-sm font-bold text-white uppercase tracking-wider"></h4>
                    <ul class="space-y-2 text-xs">
                        <li><a href="#menu"     data-i18n="nav_menu"       class="hover:text-brand-red transition"></a></li>
                        <li><a href="#branches" data-i18n="nav_branches"   class="hover:text-brand-red transition"></a></li>
                        <li><a href="#menu"     data-i18n="nav_promos"     class="hover:text-brand-red transition"></a></li>
                        <li><a href="javascript:void(0)" onclick="toggleCart()" data-i18n="nav_cart" class="hover:text-brand-red transition"></a></li>
                    </ul>
                </div>

                <!-- Col 3 -->
                <div class="space-y-3">
                    <h4 data-i18n="footer_contacts_title" class="text-sm font-bold text-white uppercase tracking-wider"></h4>
                    <ul class="space-y-2 text-xs" id="footerContactInfo"></ul>
                </div>

                <!-- Col 4 -->
                <div class="space-y-3">
                    <h4 data-i18n="footer_delivery_title" class="text-sm font-bold text-white uppercase tracking-wider"></h4>
                    <p data-i18n="footer_delivery_text" class="text-xs leading-relaxed"></p>
                    <div class="bg-brand-bg/60 p-3 rounded-xl border border-brand-border/60 text-[11px] text-brand-gold flex items-center gap-2">
                        <i class="fa-solid fa-motorcycle text-lg"></i>
                        <span data-i18n="footer_delivery_time"></span>
                    </div>
                </div>
            </div>

            <div class="pt-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs">
                <p data-i18n="footer_copy"></p>
                <div class="flex gap-4 text-gray-500 text-[11px]">
                    <a href="#" data-i18n="footer_privacy" class="hover:text-gray-400 transition"></a>
                    <span>•</span>
                    <a href="#" data-i18n="footer_terms" class="hover:text-gray-400 transition"></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- CART SIDEBAR -->
    <div id="cartDrawer" class="fixed inset-0 z-50 invisible pointer-events-none transition-all duration-300">
        <div id="cartBackdrop" onclick="toggleCart()" class="absolute inset-0 bg-black/70 opacity-0 transition-opacity duration-300"></div>
        <div id="cartPanel" class="absolute right-0 top-0 h-full w-full max-w-full sm:max-w-md bg-brand-card border-l border-brand-border shadow-2xl flex flex-col translate-x-full transition-transform duration-300 pointer-events-auto">
            <div class="p-5 border-b border-brand-border flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-basket-shopping text-brand-red text-xl"></i>
                    <h3 data-i18n="cart_title" class="text-lg font-bold text-white"></h3>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="clearCart()" class="text-xs text-gray-500 hover:text-red-400 transition">
                        <i class="fa-solid fa-trash mr-1"></i><span data-i18n="cart_clear"></span>
                    </button>
                    <button onclick="toggleCart()" class="text-gray-400 hover:text-white p-2 text-xl">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>
            <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
            <div class="p-5 border-t border-brand-border bg-brand-bg/50 space-y-4">
                <div class="space-y-2">
                    <div class="flex justify-between text-sm text-gray-400">
                        <span data-i18n="cart_subtotal_label"></span>
                        <span id="subtotalPrice">0</span>
                    </div>
                    <div class="flex justify-between text-sm text-gray-400">
                        <span data-i18n="cart_delivery_label"></span>
                        <span id="deliveryPrice"></span>
                    </div>
                    <div class="flex justify-between text-lg font-bold text-white pt-2 border-t border-brand-border">
                        <span data-i18n="cart_total_label"></span>
                        <span id="totalPrice" class="text-brand-red">0</span>
                    </div>
                </div>
                <button onclick="openCheckoutModal()" id="checkoutBtn" disabled
                    class="w-full bg-green-600 hover:bg-green-700 disabled:bg-gray-700 text-white font-bold py-3.5 rounded-xl transition flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span data-i18n="cart_checkout_btn"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- CHECKOUT MODAL -->
    <div id="checkoutModal" class="fixed inset-0 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/80 backdrop-blur-sm">
        <div class="bg-brand-card border border-brand-border w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 sm:p-6 relative max-h-[92vh] overflow-y-auto">
            <button onclick="closeCheckoutModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <h3 data-i18n="checkout_title" class="text-2xl font-bold text-white mb-2"></h3>
            <p data-i18n="checkout_subtitle" class="text-xs text-gray-400 mb-6"></p>
            <form id="orderForm" onsubmit="submitOrderToWhatsapp(event)" class="space-y-4">
                <div>
                    <label data-i18n="checkout_branch_label" class="block text-xs font-semibold uppercase text-brand-gold mb-1"></label>
                    <select id="custBranch" required class="w-full bg-brand-bg border border-brand-gold/50 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-gold"></select>
                </div>
                <div>
                    <label data-i18n="checkout_name_label" class="block text-xs font-semibold uppercase text-gray-400 mb-1"></label>
                    <input type="text" required id="custName" data-i18n-placeholder="checkout_name_placeholder"
                        class="w-full bg-brand-bg border border-brand-border rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-red">
                </div>
                <div>
                    <label data-i18n="checkout_phone_label" class="block text-xs font-semibold uppercase text-gray-400 mb-1"></label>
                    <input type="tel" required id="custPhone" placeholder="0 (555) 00-00-00"
                        class="w-full bg-brand-bg border border-brand-border rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-red">
                </div>
                <div>
                    <label data-i18n="checkout_address_label" class="block text-xs font-semibold uppercase text-gray-400 mb-1"></label>
                    <input type="text" required id="custAddress" data-i18n-placeholder="checkout_address_placeholder"
                        class="w-full bg-brand-bg border border-brand-border rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-red">
                </div>
                <div>
                    <label data-i18n="checkout_notes_label" class="block text-xs font-semibold uppercase text-gray-400 mb-1"></label>
                    <textarea id="custNotes" rows="2" data-i18n-placeholder="checkout_notes_placeholder"
                        class="w-full bg-brand-bg border border-brand-border rounded-xl p-3 text-sm text-white focus:outline-none focus:border-brand-red"></textarea>
                </div>
                <div class="pt-4 border-t border-brand-border">
                    <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl transition flex items-center justify-center gap-2">
                        <i class="fa-brands fa-whatsapp text-xl"></i>
                        <span data-i18n="checkout_submit_btn"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-6 sm:bottom-6 sm:max-w-xs z-50 bg-brand-red text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3 translate-y-20 opacity-0 transition-all duration-300">
        <i class="fa-solid fa-circle-check text-xl shrink-0"></i>
        <span id="toastMsg" class="font-medium text-sm"></span>
    </div>

    <script>
    // ════════════════════════════════════════════════════
    //  КОТОРМО СИСТЕМАСЫ
    // ════════════════════════════════════════════════════
    const i18n = {
        ru: {
            // Announcement bar
            promo_label:              'АКЦИЯ:',
            promo_text:               'При заказе от 2500 сом — Бесплатная доставка!',
            // Header nav
            nav_menu:                 'Меню',
            nav_branches:             'Филиалы',
            nav_promos:               'Акции и скидки',
            nav_cart:                 'Корзина',
            cart_btn:                 'Корзина',
            search_placeholder:       'Искать роллы или сеты...',
            search_placeholder_short: 'Поиск...',
            // Hero
            hero_badge:               '✨ Выберите ближайший филиал и оформите заказ',
            hero_title_1:             'Настоящий ',
            hero_title_2:             'японский вкус',
            hero_title_3:             ' у вас дома',
            hero_desc:                'Эл суши — самые вкусные и качественные суши для нашего народа! Заказ мгновенно отправляется на WhatsApp выбранного филиала.',
            hero_btn_menu:            'Смотреть меню',
            hero_btn_branches:        'Наши филиалы',
            // Menu
            menu_title:               'Наше Меню',
            menu_subtitle:            'Выберите категорию и оформите заказ',
            menu_empty:               'В этой категории пока нет позиций',
            menu_add_btn:             'Добавить',
            // Branches
            branches_title:           'Наши Филиалы',
            branches_subtitle:        'Позвоните или напишите нам в WhatsApp в любой из наших филиалов',

    let currentLang = localStorage.getItem('elsushi_lang') || 'ru';

    function t(key, ...args) {
        const val = i18n[currentLang][key];
        if (typeof val === 'function') return val(...args);
        return val || i18n['ru'][key] || key;
    }

    function setLang(lang) {
        currentLang = lang;
        localStorage.setItem('elsushi_lang', lang);
        applyTranslations();
        renderAll();
        // Баскычтарды жаңылоо
        document.getElementById('langBtn-ru').classList.toggle('active', lang === 'ru');
        document.getElementById('langBtn-ky').classList.toggle('active', lang === 'ky');
        document.documentElement.lang = lang;
    }

    function applyTranslations() {
        // data-i18n текст
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            const val = t(key);
            if (typeof val === 'string') el.textContent = val;
        });
        // data-i18n-placeholder
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
            const key = el.getAttribute('data-i18n-placeholder');
            el.placeholder = t(key);
        });
        // Иштөө убактысы
        const wh = document.getElementById('headerWorkHours');
        if (wh) wh.textContent = t('work_hours_prefix') + siteSettings.workHours;
        // Филиалдар саны
        const bc = document.getElementById('activeBranchCount');
        if (bc) bc.textContent = t('branch_count', branches.length);
        // Footer байланыш
        renderFooterContacts();
    }

    function addToCart(id) {
        const item = products.find(p => p.id === id);
        if (!item) return;
        const exist = cart.find(c => c.id === id);
        if (exist) { exist.qty += 1; }
        else { cart.push({ ...item, qty: 1 }); }
        saveCart();
        updateCartUI();
        showToast(t('cart_added_toast', item.name));
    }

    function updateQty(id, delta) {
        const index = cart.findIndex(c => c.id === id);
        if (index !== -1) {
            cart[index].qty += delta;
            if (cart[index].qty <= 0) cart.splice(index, 1);
        }
        saveCart();
        updateCartUI();
    }

    function clearCart() {
        if (cart.length === 0) return;
        if (confirm(t('cart_confirm_clear'))) {
            cart = [];
            saveCart();
            updateCartUI();
        }
    }

    function updateCartUI() {
        const badge       = document.getElementById('cartBadge');
        const container   = document.getElementById('cartItemsContainer');
        const subtotalEl  = document.getElementById('subtotalPrice');
        const totalEl     = document.getElementById('totalPrice');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const curr        = t('wa_currency');

        const totalItems  = cart.reduce((a, i) => a + i.qty, 0);
        const subtotal    = cart.reduce((a, i) => a + i.price * i.qty, 0);
        const deliveryFee = (subtotal >= 2500 || subtotal === 0) ? 0 : 150;
        const grandTotal  = subtotal === 0 ? 0 : subtotal + deliveryFee;

        badge.innerText = totalItems;

        if (cart.length === 0) {
            container.innerHTML = `
                <div class="text-center text-gray-500 py-12">
                    <i class="fa-solid fa-basket-shopping text-4xl mb-3 block opacity-30"></i>
                    ${t('cart_empty')}
                </div>`;
            checkoutBtn.disabled = true;
        } else {
            container.innerHTML = cart.map(item => `
                <div class="flex items-center gap-3 bg-brand-bg p-3 rounded-xl border border-brand-border">
                    <img src="${item.image}" class="w-14 h-14 rounded-lg object-cover"
                         onerror="this.src='https://images.unsplash.com/photo-1617196034796-73dfa7b1fd56?auto=format&fit=crop&w=100&q=60'">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-bold text-white truncate">${item.name}</h4>
                        <p class="text-xs text-brand-red font-semibold">${item.price * item.qty}${curr}</p>
                    </div>
                    <div class="flex items-center gap-2 bg-brand-card px-2 py-1 rounded-lg border border-brand-border">
                        <button onclick="updateQty(${item.id}, -1)" class="text-gray-400 hover:text-white text-xs px-1">−</button>
                        <span class="text-xs font-bold text-white w-4 text-center">${item.qty}</span>
                        <button onclick="updateQty(${item.id}, 1)" class="text-gray-400 hover:text-white text-xs px-1">+</button>
                    </div>
                </div>
            `).join('');
            checkoutBtn.disabled = false;
        }

        subtotalEl.innerText = `${subtotal}${curr}`;
        document.getElementById('deliveryPrice').innerText =
            (deliveryFee === 0 && subtotal > 0) ? t('cart_free_delivery') : `${deliveryFee}${curr}`;
        totalEl.innerText = `${grandTotal}${curr}`;

        // Текст баскычтарды да жаңылоо
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            const val = t(key);
            if (typeof val === 'string') el.textContent = val;
        });
    }

    // ════════════════════════════════════════════════════
    //  WHATSAPP ЗАКАЗ
    // ════════════════════════════════════════════════════
    function submitOrderToWhatsapp(e) {
        e.preventDefault();
        const branchId       = parseInt(document.getElementById('custBranch').value);
        const selectedBranch = branches.find(b => b.id === branchId) || branches[0];
        const name    = document.getElementById('custName').value;
        const phone   = document.getElementById('custPhone').value;
        const address = document.getElementById('custAddress').value;
        const notes   = document.getElementById('custNotes').value;

        const subtotal    = cart.reduce((a, i) => a + i.price * i.qty, 0);
        const deliveryFee = subtotal >= 2500 ? 0 : 150;
        const grandTotal  = subtotal + deliveryFee;
        const curr        = t('wa_currency');

        let text = t('wa_header');
        text += t('wa_branch') + `${selectedBranch.name} (${selectedBranch.address})\n`;
        text += t('wa_client') + `${name}\n`;
        text += t('wa_phone')  + `${phone}\n`;
        text += t('wa_address')+ `${address}\n`;
        if (notes) text += t('wa_comment') + `${notes}\n`;
        text += `\n━━━━━━━━━━━━━━━━━━\n`;
        text += t('wa_items');
        cart.forEach((item, idx) => {
            text += `${idx+1}. ${item.name} × ${item.qty} = ${item.price * item.qty}${curr}\n`;
        });
        text += `━━━━━━━━━━━━━━━━━━\n`;
        text += t('wa_subtotal') + `${subtotal}${curr}\n`;
        text += t('wa_delivery') + (deliveryFee === 0 ? t('wa_free') : `${deliveryFee}${curr}`) + '\n';
        text += t('wa_total')    + `${grandTotal}${curr}\n`;

        saveOrderHistory({
            id: Date.now(),
            date: new Date().toLocaleString('ru-RU'),
            branch: selectedBranch.name,
            name, phone, address, notes,
            items: cart.map(i => ({ name: i.name, qty: i.qty, price: i.price })),
            subtotal, deliveryFee, grandTotal
        });

        window.open(`https://wa.me/${selectedBranch.phone}?text=${encodeURIComponent(text)}`, '_blank');
        cart = [];
        saveCart();
        updateCartUI();
        closeCheckoutModal();
        showToast(t('order_sent_toast'));
    }

    function saveOrderHistory(order) {
        const history = JSON.parse(localStorage.getItem('elsushi_orders')) || [];
        history.unshift(order);
        localStorage.setItem('elsushi_orders', JSON.stringify(history.slice(0, 100)));
    }

    // ════════════════════════════════════════════════════
    //  CART DRAWER
    // ════════════════════════════════════════════════════
    function toggleCart() {
        const drawer   = document.getElementById('cartDrawer');
        const panel    = document.getElementById('cartPanel');
        const backdrop = document.getElementById('cartBackdrop');
        if (drawer.classList.contains('invisible')) {
            drawer.classList.remove('invisible', 'pointer-events-none');
            setTimeout(() => { backdrop.classList.add('opacity-100'); panel.classList.remove('translate-x-full'); }, 10);
        } else {
            backdrop.classList.remove('opacity-100');
            panel.classList.add('translate-x-full');
            setTimeout(() => drawer.classList.add('invisible', 'pointer-events-none'), 300);
        }
    }

    function openCheckoutModal() {
        toggleCart();
        updateBranchDropdown();
        // Checkout modal текстин жаңылоо
        applyTranslations();
        document.getElementById('checkoutModal').classList.remove('hidden');
    }

    function closeCheckoutModal() {
        document.getElementById('checkoutModal').classList.add('hidden');
    }

    // ════════════════════════════════════════════════════
    //  TOAST
    // ════════════════════════════════════════════════════
    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').innerText = msg;
        toast.classList.remove('translate-y-20', 'opacity-0');
        setTimeout(() => toast.classList.add('translate-y-20', 'opacity-0'), 2500);
    }

    // ════════════════════════════════════════════════════
    //  ИЗДӨӨ
    // ════════════════════════════════════════════════════
    function handleSearch() {
        const q1 = document.getElementById('searchInput').value.toLowerCase().trim();
        const q2 = document.getElementById('mobileSearchInput').value.toLowerCase().trim();
        const q  = q1 || q2;
        if (!q) return renderProducts();
        renderProducts(products.filter(p =>
            p.name.toLowerCase().includes(q) || (p.desc || '').toLowerCase().includes(q)
        ));
    }
    </script>
</body>
</html>
